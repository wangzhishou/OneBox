name: Android CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      app_flavor:
        description: App flavor
        type: choice
        required: true
        default: google
        options:
          - google
          - foss
          - xiaomi
          - yyb
          - oppo
          - vivo
          - huawei
          - onebox
      abi_flavor:
        description: ABI flavor
        type: choice
        required: true
        default: universal
        options:
          - arm64
          - universal
      build_type:
        description: Build type
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      publish_release:
        description: Auto publish GitHub Release (manual release only)
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag to publish (required when auto publish is enabled)
        type: string
        required: false

env:
  DEFAULT_APP_FLAVOR: google
  DEFAULT_ABI_FLAVOR: universal
  DEFAULT_BUILD_TYPE: debug

concurrency:
  # workflow_dispatch 各次运行用独立 group (run_id), 避免手动批量触发时互相取消
  group: android-ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  build_and_release:
    outputs:
      should_publish_release: ${{ steps.compute.outputs.should_publish_release }}
      release_tag: ${{ steps.compute.outputs.release_tag }}

    # tag 推送: 海外(google/foss)各出 universal + arm64, 国内 6 渠道各出 arm64(给 GitCode 当国内更新源);
    # 手动触发: 单个所选变体(include 为空, 行为与以前完全一致)
    strategy:
      fail-fast: false
      matrix:
        app_flavor: ${{ github.event_name == 'push' && fromJSON('["google","foss"]') || fromJSON(format('["{0}"]', inputs.app_flavor || 'google')) }}
        abi_flavor: ${{ github.event_name == 'push' && fromJSON('["universal","arm64"]') || fromJSON(format('["{0}"]', inputs.abi_flavor || 'universal')) }}
        # 国内渠道用 include 追加(不覆盖上面的组合): arm64 一个架构足够 ——
        # 手机端全是 arm64, 且 arm64/universal 两个 abi flavor 的 abiFilters 都是 arm64-v8a。
        include: ${{ github.event_name == 'push' && fromJSON('[{"app_flavor":"xiaomi","abi_flavor":"arm64"},{"app_flavor":"yyb","abi_flavor":"arm64"},{"app_flavor":"oppo","abi_flavor":"arm64"},{"app_flavor":"vivo","abi_flavor":"arm64"},{"app_flavor":"huawei","abi_flavor":"arm64"},{"app_flavor":"onebox","abi_flavor":"arm64"}]') || fromJSON('[]') }}

    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 免费 runner 只有 16G 物理内存, R8 全量混淆峰值超内存会被杀进程
      # (日志表现为 The operation was canceled); 加 10G swap 兜底(原生 bash, dd 写 /mnt 数据盘)
      - name: Set Swap Space
        shell: bash
        run: |
          set -euo pipefail
          SWAP=/mnt/ghswap.img
          if swapon --show=NAME --noheadings | grep -qx "$SWAP"; then
            echo "swap already active"
          else
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=10240 status=none
            sudo chmod 600 "$SWAP"
            sudo mkswap "$SWAP" >/dev/null
            sudo swapon "$SWAP"
          fi
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute build variables
        id: compute
        shell: bash
        env:
          REQUESTED_APP_FLAVOR: ${{ matrix.app_flavor }}
          REQUESTED_ABI_FLAVOR: ${{ matrix.abi_flavor }}
          REQUESTED_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || env.DEFAULT_BUILD_TYPE }}
          REQUESTED_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || 'false' }}
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          capitalize() {
            local value="$1"
            echo "${value^}"
          }

          APP_FLAVOR="$REQUESTED_APP_FLAVOR"
          ABI_FLAVOR="$REQUESTED_ABI_FLAVOR"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            BUILD_TYPE="release"
            VERSION_NAME_OVERRIDE="$GITHUB_REF_NAME"
            ARTIFACT_SUFFIX="$GITHUB_REF_NAME"
            SHOULD_PUBLISH_RELEASE="true"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            BUILD_TYPE="$REQUESTED_BUILD_TYPE"
            PUBLISH_RELEASE="$(echo "$REQUESTED_PUBLISH_RELEASE" | tr '[:upper:]' '[:lower:]')"

            if [[ "$BUILD_TYPE" == "release" && "$PUBLISH_RELEASE" == "true" ]]; then
              if [[ -z "$REQUESTED_RELEASE_TAG" ]]; then
                echo "release_tag is required when auto publish is enabled for a manual release build"
                exit 1
              fi
              VERSION_NAME_OVERRIDE="$REQUESTED_RELEASE_TAG"
              ARTIFACT_SUFFIX="$REQUESTED_RELEASE_TAG"
              SHOULD_PUBLISH_RELEASE="true"
              RELEASE_TAG="$REQUESTED_RELEASE_TAG"
            else
              VERSION_NAME_OVERRIDE=""
              ARTIFACT_SUFFIX="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
              SHOULD_PUBLISH_RELEASE="false"
              RELEASE_TAG=""
            fi
          fi

          BUILD_TYPE_CAPITALIZED="$(capitalize "$BUILD_TYPE")"
          VARIANT_NAME="$(capitalize "$APP_FLAVOR")$(capitalize "$ABI_FLAVOR")$BUILD_TYPE_CAPITALIZED"
          # AGP 输出目录是 flavor 组合的 camelCase: 第一个小写, 后续首字母大写 (googleUniversal)
          VARIANT_DIR="${APP_FLAVOR}$(capitalize "$ABI_FLAVOR")"
          APK_DIR="app/build/outputs/apk/$VARIANT_DIR/$BUILD_TYPE"
          OUTPUT_APK_NAME="OneBox-${ARTIFACT_SUFFIX}-${APP_FLAVOR}-${ABI_FLAVOR}-${BUILD_TYPE}.apk"
          if [[ "$BUILD_TYPE" == "release" ]]; then
            SHOULD_SIGN="true"
          else
            SHOULD_SIGN="false"
          fi

          {
            echo "APP_FLAVOR=$APP_FLAVOR"
            echo "ABI_FLAVOR=$ABI_FLAVOR"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "VARIANT_NAME=$VARIANT_NAME"
            echo "VARIANT_DIR=$VARIANT_DIR"
            echo "BUILD_TASK=:app:assemble$VARIANT_NAME"
            echo "APK_DIR=$APK_DIR"
            echo "VERSION_NAME_OVERRIDE=$VERSION_NAME_OVERRIDE"
            echo "OUTPUT_APK_NAME=$OUTPUT_APK_NAME"
            echo "SHOULD_SIGN=$SHOULD_SIGN"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"

          {
            echo "should_publish_release=$SHOULD_PUBLISH_RELEASE"
            echo "release_tag=$RELEASE_TAG"
            echo "build_type=$BUILD_TYPE"
            echo "variant_name=$VARIANT_NAME"
            echo "should_sign=$SHOULD_SIGN"
          } >> "$GITHUB_OUTPUT"

      - name: Get Git Version
        shell: bash
        run: |
          echo "GIT_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 生成 keystore.properties / keystore-google.properties:
      # 1) Gradle 构建期签名需要真实 storeFile; 2) 后端域名/游客 token/和风凭据
      #    经 keystore.properties 注入 BuildConfig, 缺失时构建产物为"断网版"
      - name: Prepare signing keys and injected config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GOOGLE_SIGNING_KEY: ${{ secrets.GOOGLE_SIGNING_KEY }}
          GOOGLE_ALIAS: ${{ secrets.GOOGLE_ALIAS }}
          GOOGLE_KEY_STORE_PASS: ${{ secrets.GOOGLE_KEY_STORE_PASS }}
          GOOGLE_KEY_PASS: ${{ secrets.GOOGLE_KEY_PASS }}
          APP_KEYS_PROPERTIES: ${{ secrets.APP_KEYS_PROPERTIES }}
        shell: bash
        run: |
          set -euo pipefail
          : > keystore.properties
          if [[ "$BUILD_TYPE" == "release" && "$APP_FLAVOR" == "google" ]]; then
            printf '%s' "$GOOGLE_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/google.keystore"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/google.keystore"
              printf 'storePassword=%s\n' "$GOOGLE_KEY_STORE_PASS"
              printf 'keyAlias=%s\n' "$GOOGLE_ALIAS"
              printf 'keyPassword=%s\n' "$GOOGLE_KEY_PASS"
            } > keystore-google.properties
            # 快速校验密钥库与密码, 失败立即中止, 不用等 40 分钟构建
            "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/google.keystore" \
              -storepass "$GOOGLE_KEY_STORE_PASS" -alias "$GOOGLE_ALIAS" >/dev/null \
              && echo "google keystore verified"
          elif [[ "$BUILD_TYPE" == "release" ]]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
              printf 'storePassword=%s\n' "$KEY_STORE_PASS"
              printf 'keyAlias=%s\n' "$ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASS"
            } > keystore.properties
            "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEY_STORE_PASS" -alias "$ALIAS" >/dev/null \
              && echo "release keystore verified"
          fi
          if [[ -n "$APP_KEYS_PROPERTIES" ]]; then
            cat >> keystore.properties <<EOF
          $APP_KEYS_PROPERTIES
          EOF
          fi

      - name: Build selected release APK
        env:
          GIT_VERSION: ${{ env.GIT_VERSION }}
          VERSION_NAME_OVERRIDE: ${{ env.VERSION_NAME_OVERRIDE }}
        shell: bash
        run: |
          if [[ -n "$VERSION_NAME_OVERRIDE" ]]; then
            VERSION_NAME="$VERSION_NAME_OVERRIDE" GIT_VERSION="$GIT_VERSION" ./gradlew -Dorg.gradle.offline=false -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g" --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME" "$BUILD_TASK" -x "lintVital$VARIANT_NAME" -x "lintVitalAnalyze$VARIANT_NAME"
          else
            GIT_VERSION="$GIT_VERSION" ./gradlew -Dorg.gradle.offline=false -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g" --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME" "$BUILD_TASK" -x "lintVital$VARIANT_NAME" -x "lintVitalAnalyze$VARIANT_NAME"
          fi

      # Crashlytics 反混淆 (仅 google release).
      # 项目未应用 Crashlytics 插件, R8 混淆后的 mapping.txt 需手动上传:
      #   mapping  : app/build/outputs/mapping/<variant>/mapping.txt
      #   resource : app/build/crashlytics/mappingfileid-<abi>.xml (由 Gradle 任务生成, id 与 APK 内一致)
      # 认证: CI 无法交互式 firebase login, 改用服务账号 (Application Default Credentials).
      # mapping_file_id 由 versionName+versionCode+ABI 确定性生成, 同一版本重复构建/上传幂等.
      # 上传失败不阻断发布, 只发 warning (该版本崩溃堆栈将保持混淆)
      - name: Upload Crashlytics mapping (google release)
        if: env.APP_FLAVOR == 'google' && env.BUILD_TYPE == 'release'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -uo pipefail

          warn() { echo "::warning title=Crashlytics mapping::$1"; }

          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            warn "未配置 secret FIREBASE_SERVICE_ACCOUNT, 跳过 mapping 上传"
            exit 0
          fi

          # VARIANT_DIR 由前面的步骤算出, 已是 AGP 产物目录的小写首字母形式 (googleUniversal)
          MAPPING="app/build/outputs/mapping/${VARIANT_DIR}Release/mapping.txt"
          if [[ ! -f "$MAPPING" ]]; then
            MAPPING="$(find app/build/outputs/mapping -maxdepth 2 -type f -name mapping.txt \
              -path "*${ABI_FLAVOR}*" 2>/dev/null | head -n 1)"
          fi
          RESOURCE_FILE="app/build/crashlytics/mappingfileid-${ABI_FLAVOR}.xml"
          if [[ -z "$MAPPING" || ! -f "$MAPPING" || ! -f "$RESOURCE_FILE" ]]; then
            warn "缺 mapping 或 resource 文件 (mapping='${MAPPING:-空}' resource='$RESOURCE_FILE'), 跳过上传"
            exit 0
          fi
          echo "mapping       : $MAPPING"
          echo "resource-file : $RESOURCE_FILE"

          # release 包名是 com.shifenmiao.app (debug client 是 .debug, 不能混用)
          APP_ID="$(python3 -c '
          import json
          with open("app/src/google/assets/google-services.json") as f:
              data = json.load(f)
          for c in data.get("client", []):
              info = c.get("client_info", {})
              if info.get("android_client_info", {}).get("package_name") == "com.shifenmiao.app":
                  print(info.get("mobilesdk_app_id", ""))
                  break
          ' 2>/dev/null || true)"
          if [[ -z "$APP_ID" ]]; then
            warn "未能从 google-services.json 解析 com.shifenmiao.app 的 mobilesdk_app_id"
            exit 0
          fi
          echo "app-id        : $APP_ID"

          if ! command -v firebase >/dev/null 2>&1; then
            echo "==> 安装 firebase-tools"
            npm install -g firebase-tools@15 >/dev/null 2>&1 || {
              warn "firebase-tools 安装失败, 跳过 mapping 上传"
              exit 0
            }
          fi

          # secret 兼容两种写法: base64(推荐, 与 SIGNING_KEY 一致) 或原始 JSON
          SA_RAW="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode 2>/dev/null || true)"
          if [[ "$SA_RAW" != *'"private_key"'* ]]; then
            SA_RAW="$FIREBASE_SERVICE_ACCOUNT"
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA_RAW" > "$GOOGLE_APPLICATION_CREDENTIALS"

          # firebase CLI 上传成功后的收尾阶段偶发非 0 退出, 以成功文案为准, 失败重试一次
          for attempt in 1 2; do
            output="$(firebase crashlytics:mappingfile:upload \
              --app "$APP_ID" --resource-file "$RESOURCE_FILE" "$MAPPING" 2>&1 || true)"
            echo "$output"
            if grep -q "Successfully uploaded mapping file" <<< "$output"; then
              echo "==> mapping 上传成功"
              exit 0
            fi
            echo "[重试] 第 $attempt 次上传未成功" >&2
          done

          warn "mapping 上传失败, 该版本崩溃堆栈将保持混淆 (可本地用 build_release.sh 补传)"
          exit 0

      - name: Prepare final APK artifact
        id: package_apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GOOGLE_SIGNING_KEY: ${{ secrets.GOOGLE_SIGNING_KEY }}
          GOOGLE_ALIAS: ${{ secrets.GOOGLE_ALIAS }}
          GOOGLE_KEY_STORE_PASS: ${{ secrets.GOOGLE_KEY_STORE_PASS }}
          GOOGLE_KEY_PASS: ${{ secrets.GOOGLE_KEY_PASS }}
        shell: bash
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          INPUT_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*-$BUILD_TYPE.apk" ! -name '*-signed.apk' | sort | head -n 1)"
          if [[ -z "$INPUT_APK" ]]; then
            echo "No $BUILD_TYPE APK found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          OUTPUT_APK="$DIST_DIR/$OUTPUT_APK_NAME"

          if [[ "$APP_FLAVOR" == "foss" ]]; then
            # foss (F-Droid) 渠道: AGP 已在构建期用 keystore.properties 完成 V2 签名,
            # 产物 zip 结构与 F-Droid 从源码重建的 unsigned APK 逐字节一致(apksigcopier 可直接比对).
            # 此处若再用独立 apksigner 重签, 新版 build-tools 会重写 zip 对齐 extra,
            # 破坏 F-Droid 可复现构建校验 (1.4.0 曾因此失败), 故直接跳过.
            mv "$INPUT_APK" "$OUTPUT_APK"
          elif [[ "$SHOULD_SIGN" == "true" ]]; then
            # 按渠道选择签名密钥 (google 渠道使用独立的 Google 签名)
            if [[ "$APP_FLAVOR" == "google" ]]; then
              KS_ALIAS="$GOOGLE_ALIAS"; KS_STORE_PASS="$GOOGLE_KEY_STORE_PASS"; KS_KEY_PASS="$GOOGLE_KEY_PASS"
              KEYSTORE_PATH="$RUNNER_TEMP/google.keystore"
              if [[ -z "$GOOGLE_SIGNING_KEY" || -z "$KS_ALIAS" || -z "$KS_STORE_PASS" || -z "$KS_KEY_PASS" ]]; then
                echo "Google signing secrets are missing (GOOGLE_SIGNING_KEY/GOOGLE_ALIAS/GOOGLE_KEY_STORE_PASS/GOOGLE_KEY_PASS)"
                exit 1
              fi
            else
              KS_ALIAS="$ALIAS"; KS_STORE_PASS="$KEY_STORE_PASS"; KS_KEY_PASS="$KEY_PASS"
              KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
              if [[ -z "$SIGNING_KEY" || -z "$KS_ALIAS" || -z "$KS_STORE_PASS" || -z "$KS_KEY_PASS" ]]; then
                echo "Signing secrets are missing"
                exit 1
              fi
            fi

            BUILD_TOOLS_DIR="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            if [[ -z "$BUILD_TOOLS_DIR" ]]; then
              echo "Android build-tools not found"
              exit 1
            fi

            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_STORE_PASS" \
              --key-pass "pass:$KS_KEY_PASS" \
              --out "$OUTPUT_APK" \
              "$INPUT_APK"

            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$OUTPUT_APK"
            rm -f "$INPUT_APK"
          else
            mv "$INPUT_APK" "$OUTPUT_APK"
          fi

          echo "output_apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          ls -la "$DIST_DIR"

      - uses: actions/upload-artifact@v7
        id: upload-signed-apk
        with:
          # matrix 各分支产物名必须唯一 (artifact v4 不可变), 发布时按前缀归集
          name: built-apk-${{ matrix.app_flavor }}-${{ matrix.abi_flavor }}
          path: ${{ steps.package_apk.outputs.output_apk_path }}



  create_release:
    if: needs.build_and_release.outputs.should_publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    needs:
      - build_and_release

    steps:
      # gh release create/upload 需要本地 git 仓库上下文
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          pattern: built-apk-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Release tag is empty"
            exit 1
          fi

          shopt -s nullglob
          # GitHub Release 只放海外包(google/foss); 国内 6 渠道包只进 GitCode
          apks=(release-assets/*-google-*.apk release-assets/*-foss-*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No APK files downloaded"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          else
            if [[ "$RELEASE_TAG" == *-* ]]; then
              gh release create "$RELEASE_TAG" "${apks[@]}" --prerelease --generate-notes --target "$GITHUB_SHA"
            else
              gh release create "$RELEASE_TAG" "${apks[@]}" --generate-notes --target "$GITHUB_SHA"
            fi
          fi

      # 国内渠道的更新源是 GitCode(国内直连不了 GitHub)。
      # GitCode 的仓库镜像只同步分支/标签/提交,不同步 Release 附件,所以国内包要在这里补发一次。
      # tag 推送时构建矩阵已包含国内 6 渠道(见上面的 include), 手动 dispatch 单个国内渠道时同样生效;
      # 没配 GITCODE_TOKEN 或这次没打国内包时安静跳过。前置条件: 该 tag 必须已经推到 GitCode。
      - name: Publish to GitCode (domestic update source)
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RELEASE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
        shell: bash
        run: |
          if [[ -z "${GITCODE_TOKEN}" ]]; then
            echo "GITCODE_TOKEN 未配置,跳过 GitCode 发布(国内渠道仍可本地跑 scripts/publish_gitcode_release.py)"
            exit 0
          fi
          python3 scripts/publish_gitcode_release.py \
            --tag "$RELEASE_TAG" \
            --dir release-assets \
            --channels xiaomi yyb oppo vivo huawei onebox
