name: Android CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      app_flavor:
        description: App flavor
        type: choice
        required: true
        default: google
        options:
          - google
          - xiaomi
          - yyb
          - oppo
          - vivo
          - huawei
          - onebox
      abi_flavor:
        description: ABI flavor
        type: choice
        required: true
        default: universal
        options:
          - arm64
          - arm32
          - universal
      build_type:
        description: Build type
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      publish_release:
        description: Auto publish GitHub Release (manual release only)
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag to publish (required when auto publish is enabled)
        type: string
        required: false

env:
  DEFAULT_APP_FLAVOR: google
  DEFAULT_ABI_FLAVOR: universal
  DEFAULT_BUILD_TYPE: debug

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    outputs:
      should_publish_release: ${{ steps.compute.outputs.should_publish_release }}
      release_tag: ${{ steps.compute.outputs.release_tag }}

    # tag 推送: Google 渠道出 universal + arm64 两个包; 手动触发: 单个所选变体
    strategy:
      fail-fast: false
      matrix:
        abi_flavor: ${{ github.event_name == 'push' && fromJSON('["universal","arm64"]') || fromJSON(format('["{0}"]', inputs.abi_flavor || 'universal')) }}

    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 免费 runner 只有 16G 物理内存, R8 全量混淆峰值超内存会被杀进程
      # (日志表现为 The operation was canceled); 加 10G swap 兜底(原生 bash, dd 写 /mnt 数据盘)
      - name: Set Swap Space
        shell: bash
        run: |
          set -euo pipefail
          SWAP=/mnt/ghswap.img
          if swapon --show=NAME --noheadings | grep -qx "$SWAP"; then
            echo "swap already active"
          else
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=10240 status=none
            sudo chmod 600 "$SWAP"
            sudo mkswap "$SWAP" >/dev/null
            sudo swapon "$SWAP"
          fi
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute build variables
        id: compute
        shell: bash
        env:
          REQUESTED_APP_FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.app_flavor || env.DEFAULT_APP_FLAVOR }}
          REQUESTED_ABI_FLAVOR: ${{ matrix.abi_flavor }}
          REQUESTED_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || env.DEFAULT_BUILD_TYPE }}
          REQUESTED_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || 'false' }}
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          capitalize() {
            local value="$1"
            echo "${value^}"
          }

          APP_FLAVOR="$REQUESTED_APP_FLAVOR"
          ABI_FLAVOR="$REQUESTED_ABI_FLAVOR"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            BUILD_TYPE="release"
            VERSION_NAME_OVERRIDE="$GITHUB_REF_NAME"
            ARTIFACT_SUFFIX="$GITHUB_REF_NAME"
            SHOULD_PUBLISH_RELEASE="true"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            BUILD_TYPE="$REQUESTED_BUILD_TYPE"
            PUBLISH_RELEASE="$(echo "$REQUESTED_PUBLISH_RELEASE" | tr '[:upper:]' '[:lower:]')"

            if [[ "$BUILD_TYPE" == "release" && "$PUBLISH_RELEASE" == "true" ]]; then
              if [[ -z "$REQUESTED_RELEASE_TAG" ]]; then
                echo "release_tag is required when auto publish is enabled for a manual release build"
                exit 1
              fi
              VERSION_NAME_OVERRIDE="$REQUESTED_RELEASE_TAG"
              ARTIFACT_SUFFIX="$REQUESTED_RELEASE_TAG"
              SHOULD_PUBLISH_RELEASE="true"
              RELEASE_TAG="$REQUESTED_RELEASE_TAG"
            else
              VERSION_NAME_OVERRIDE=""
              ARTIFACT_SUFFIX="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
              SHOULD_PUBLISH_RELEASE="false"
              RELEASE_TAG=""
            fi
          fi

          BUILD_TYPE_CAPITALIZED="$(capitalize "$BUILD_TYPE")"
          VARIANT_NAME="$(capitalize "$APP_FLAVOR")$(capitalize "$ABI_FLAVOR")$BUILD_TYPE_CAPITALIZED"
          VARIANT_DIR="${APP_FLAVOR}${ABI_FLAVOR}"
          APK_DIR="app/build/outputs/apk/$VARIANT_DIR/$BUILD_TYPE"
          OUTPUT_APK_NAME="OneBox-${ARTIFACT_SUFFIX}-${APP_FLAVOR}-${ABI_FLAVOR}-${BUILD_TYPE}.apk"
          if [[ "$BUILD_TYPE" == "release" ]]; then
            SHOULD_SIGN="true"
          else
            SHOULD_SIGN="false"
          fi

          {
            echo "APP_FLAVOR=$APP_FLAVOR"
            echo "ABI_FLAVOR=$ABI_FLAVOR"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "VARIANT_NAME=$VARIANT_NAME"
            echo "VARIANT_DIR=$VARIANT_DIR"
            echo "BUILD_TASK=:app:assemble$VARIANT_NAME"
            echo "APK_DIR=$APK_DIR"
            echo "VERSION_NAME_OVERRIDE=$VERSION_NAME_OVERRIDE"
            echo "OUTPUT_APK_NAME=$OUTPUT_APK_NAME"
            echo "SHOULD_SIGN=$SHOULD_SIGN"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"

          {
            echo "should_publish_release=$SHOULD_PUBLISH_RELEASE"
            echo "release_tag=$RELEASE_TAG"
            echo "build_type=$BUILD_TYPE"
            echo "variant_name=$VARIANT_NAME"
            echo "should_sign=$SHOULD_SIGN"
          } >> "$GITHUB_OUTPUT"

      - name: Get Git Version
        shell: bash
        run: |
          echo "GIT_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 生成 keystore.properties / keystore-google.properties:
      # 1) Gradle 构建期签名需要真实 storeFile; 2) 后端域名/游客 token/和风凭据
      #    经 keystore.properties 注入 BuildConfig, 缺失时构建产物为"断网版"
      - name: Prepare signing keys and injected config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GOOGLE_SIGNING_KEY: ${{ secrets.GOOGLE_SIGNING_KEY }}
          GOOGLE_ALIAS: ${{ secrets.GOOGLE_ALIAS }}
          GOOGLE_KEY_STORE_PASS: ${{ secrets.GOOGLE_KEY_STORE_PASS }}
          GOOGLE_KEY_PASS: ${{ secrets.GOOGLE_KEY_PASS }}
          APP_KEYS_PROPERTIES: ${{ secrets.APP_KEYS_PROPERTIES }}
        shell: bash
        run: |
          set -euo pipefail
          : > keystore.properties
          if [[ "$BUILD_TYPE" == "release" && "$APP_FLAVOR" == "google" ]]; then
            printf '%s' "$GOOGLE_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/google.keystore"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/google.keystore"
              printf 'storePassword=%s\n' "$GOOGLE_KEY_STORE_PASS"
              printf 'keyAlias=%s\n' "$GOOGLE_ALIAS"
              printf 'keyPassword=%s\n' "$GOOGLE_KEY_PASS"
            } > keystore-google.properties
            # 快速校验密钥库与密码, 失败立即中止, 不用等 40 分钟构建
            "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/google.keystore" \
              -storepass "$GOOGLE_KEY_STORE_PASS" -alias "$GOOGLE_ALIAS" >/dev/null \
              && echo "google keystore verified"
          elif [[ "$BUILD_TYPE" == "release" ]]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
              printf 'storePassword=%s\n' "$KEY_STORE_PASS"
              printf 'keyAlias=%s\n' "$ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASS"
            } > keystore.properties
            "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEY_STORE_PASS" -alias "$ALIAS" >/dev/null \
              && echo "release keystore verified"
          fi
          if [[ -n "$APP_KEYS_PROPERTIES" ]]; then
            cat >> keystore.properties <<EOF
          $APP_KEYS_PROPERTIES
          EOF
          fi

      - name: Build selected release APK
        env:
          GIT_VERSION: ${{ env.GIT_VERSION }}
          VERSION_NAME_OVERRIDE: ${{ env.VERSION_NAME_OVERRIDE }}
        shell: bash
        run: |
          if [[ -n "$VERSION_NAME_OVERRIDE" ]]; then
            VERSION_NAME="$VERSION_NAME_OVERRIDE" GIT_VERSION="$GIT_VERSION" ./gradlew -Dorg.gradle.offline=false -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g" --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME" "$BUILD_TASK"
          else
            GIT_VERSION="$GIT_VERSION" ./gradlew -Dorg.gradle.offline=false -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g" --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME" "$BUILD_TASK"
          fi

      - name: Prepare final APK artifact
        id: package_apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GOOGLE_SIGNING_KEY: ${{ secrets.GOOGLE_SIGNING_KEY }}
          GOOGLE_ALIAS: ${{ secrets.GOOGLE_ALIAS }}
          GOOGLE_KEY_STORE_PASS: ${{ secrets.GOOGLE_KEY_STORE_PASS }}
          GOOGLE_KEY_PASS: ${{ secrets.GOOGLE_KEY_PASS }}
        shell: bash
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          INPUT_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*-$BUILD_TYPE.apk" ! -name '*-signed.apk' | sort | head -n 1)"
          if [[ -z "$INPUT_APK" ]]; then
            echo "No $BUILD_TYPE APK found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          OUTPUT_APK="$DIST_DIR/$OUTPUT_APK_NAME"

          if [[ "$SHOULD_SIGN" == "true" ]]; then
            # 按渠道选择签名密钥 (google 渠道使用独立的 Google 签名)
            if [[ "$APP_FLAVOR" == "google" ]]; then
              KS_ALIAS="$GOOGLE_ALIAS"; KS_STORE_PASS="$GOOGLE_KEY_STORE_PASS"; KS_KEY_PASS="$GOOGLE_KEY_PASS"
              KEYSTORE_PATH="$RUNNER_TEMP/google.keystore"
              if [[ -z "$GOOGLE_SIGNING_KEY" || -z "$KS_ALIAS" || -z "$KS_STORE_PASS" || -z "$KS_KEY_PASS" ]]; then
                echo "Google signing secrets are missing (GOOGLE_SIGNING_KEY/GOOGLE_ALIAS/GOOGLE_KEY_STORE_PASS/GOOGLE_KEY_PASS)"
                exit 1
              fi
            else
              KS_ALIAS="$ALIAS"; KS_STORE_PASS="$KEY_STORE_PASS"; KS_KEY_PASS="$KEY_PASS"
              KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
              if [[ -z "$SIGNING_KEY" || -z "$KS_ALIAS" || -z "$KS_STORE_PASS" || -z "$KS_KEY_PASS" ]]; then
                echo "Signing secrets are missing"
                exit 1
              fi
            fi

            BUILD_TOOLS_DIR="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            if [[ -z "$BUILD_TOOLS_DIR" ]]; then
              echo "Android build-tools not found"
              exit 1
            fi

            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_STORE_PASS" \
              --key-pass "pass:$KS_KEY_PASS" \
              --out "$OUTPUT_APK" \
              "$INPUT_APK"

            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$OUTPUT_APK"
            rm -f "$INPUT_APK"
          else
            mv "$INPUT_APK" "$OUTPUT_APK"
          fi

          echo "output_apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          ls -la "$DIST_DIR"

      - uses: actions/upload-artifact@v4
        id: upload-signed-apk
        with:
          # matrix 各分支产物名必须唯一 (artifact v4 不可变), 发布时按前缀归集
          name: built-apk-${{ matrix.abi_flavor }}
          path: ${{ steps.package_apk.outputs.output_apk_path }}



  create_release:
    if: needs.build_and_release.outputs.should_publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs:
      - build_and_release

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          pattern: built-apk-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Release tag is empty"
            exit 1
          fi

          shopt -s nullglob
          apks=(release-assets/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No APK files downloaded"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          else
            if [[ "$RELEASE_TAG" == *-* ]]; then
              gh release create "$RELEASE_TAG" "${apks[@]}" --prerelease --generate-notes --target "$GITHUB_SHA"
            else
              gh release create "$RELEASE_TAG" "${apks[@]}" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
