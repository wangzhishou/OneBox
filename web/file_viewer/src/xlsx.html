<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The policy in ViewerPolicy.kt, which says why each part is there. ViewerPolicyTest
     keeps this copy word for word the same as that one, in every page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<!-- A spreadsheet is read as a grid of numbers, not as a page of paper: laid out at the
     WebView's 980 px default it is scaled to about 0.45 and a twelve-row budget becomes
     unreadable in the top-left corner. This page therefore declares the screen's own
     width, so a cell is a CSS px like anywhere else, and xlsx.js widens a sheet that is
     still narrower than the screen. No other viewer does this: a PDF page and a slide
     are meant to be shown whole, and the zoom-out is what keeps them sharp. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreadsheet</title>
<link rel="stylesheet" href="app.css">
<style>
  /*
   * The desk is the app's own background, seen through a transparent WebView; the sheet
   * itself is a surface on top of it. A spreadsheet has no paper to be faithful to, so
   * leaving the whole page white only puts a hard white block inside an otherwise glassy
   * app. Cells keep a ground of their own (see #sheet table) so the grid and its numbers
   * read the same over any backdrop.
   */
  body { background: transparent; }
  /* Held under as much of the title bar floating over the sheet as is on screen, which changes
     as the bar follows the reader's scrolling */
  #tabs {
    position: sticky;
    top: 0;
    top: calc(var(--vw-top, 0px) - var(--vw-bar-gone, 0px));
    z-index: 5;
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    padding: 8px;
    background: var(--vw-card);
    border-bottom: 1px solid #CFC5B2;
  }
  #tabs button {
    flex: 0 0 auto;
    border: 1px solid #CFC5B2;
    border-radius: 16px;
    background: #ffffff;
    color: #4D4636;
    font-size: 13px;
    padding: 6px 14px;
  }
  #tabs button.active {
    background: var(--vw-accent);
    border-color: var(--vw-accent);
    color: var(--vw-accent-ink);
  }
  /*
   * The sheet, at a size the reader can read.
   *
   * --vw-sheet is how much the cells are scaled so that the sheet fills the width; xlsx.js
   * measures and sets it, and it is 1 for a sheet that already fits and for one too wide to
   * fit legibly, which scrolls instead. It scales the type, the padding and the cell floor
   * together, so the grid grows rather than just the space in it, and it is a layout size
   * rather than a transform, so scrolling and the pieces of a large sheet (see xlsx.js)
   * keep working in the same units.
   */
  #sheet { padding: 8px; overflow: auto; }
  #sheet table {
    border-collapse: collapse;
    background: var(--vw-card);
    font-size: calc(13px * var(--vw-sheet, 1));
  }
  #sheet td, #sheet th {
    border: 1px solid #CFC5B2;
    padding: calc(4px * var(--vw-sheet, 1)) calc(8px * var(--vw-sheet, 1));
    white-space: pre;
    min-width: calc(40px * var(--vw-sheet, 1));
  }
  /* The sheet's first row, which only the first of a large sheet's pieces has: see xlsx.js */
  #sheet table.vw-top tr:first-child td { background: #F2EDE4; font-weight: 600; }
  /* Each piece of a large sheet is a table with borders of its own. A later one sits a border's
     width higher, so its top line lies on the bottom line of the piece above, as the rows of one
     table share theirs: one line between pieces rather than two, and every row its own height. */
  #sheet table.vw-more { margin-top: -1px; }

  /* A spreadsheet has no paper to be faithful to, unlike a Word page, so the whole
     thing goes dark rather than just the surround. The rules are borrowed from the
     app's night palette. The grid is #6B6250 and not the lighter outline tone: it
     clears 3:1 against the ground so the structure is still legible, while staying
     far enough behind the cell text not to compete with the numbers. */
  @media (prefers-color-scheme: dark) {
    /* The desk stays the app's background, as it does in the light theme */
    #tabs { background: var(--vw-card); border-bottom-color: #4D4636; }
    #tabs button { background: var(--vw-card); border-color: #4D4636; color: var(--vw-ink); }
    #sheet td, #sheet th { border-color: #6B6250; color: var(--vw-ink); }
    #sheet table.vw-top tr:first-child td { background: var(--vw-card); }
  }
</style>
<script src="lib/xlsx.full.min.js"></script>
</head>
<body>
<div id="vw-status" class="vw-status vw-wait">Loading spreadsheet…</div>
<div id="tabs" style="display:none"></div>
<div id="sheet" data-vw-find></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="find.js"></script>
<script src="xlsx.js"></script>
</body>
</html>
