<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The policy in ViewerPolicy.kt, which says why each part is there. ViewerPolicyTest
     keeps this copy word for word the same as that one, in every page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<title>Image</title>
<link rel="stylesheet" href="app.css">
<style>
  /* No viewport meta on this page, so the WebView lays out at its 980 CSS px default
     and zooms that down to fit the screen. That shrinks the status card along with
     everything else; app.css multiplies it back up by this. See the token there. */
  :root { --vw-zoom: 2.75; }

  /* Turns off Chromium's own double tap zoom, which fits the block under the finger to the
     screen and so took a picture in by a fifth. DoubleTapZoom.kt zooms a double tap instead,
     and would zoom twice without this line. A pinch is as it was. */
  html { touch-action: manipulation; }

  /* Height on both: body centres its image against the full viewport, and its
     100% only resolves if html has a height to resolve against. */
  html, body { height: 100%; }
  body {
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img { max-width: 100%; max-height: 100%; }
  img.svg { width: 100%; height: auto; max-height: none; }
</style>
</head>
<body>
<img id="img" alt="">
<script src="app.js"></script>
<script src="imgweb.js"></script>
</body>
</html>
