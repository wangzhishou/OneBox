<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The policy in ViewerPolicy.kt, which says why each part is there. ViewerPolicyTest
     keeps this copy word for word the same as that one, in every page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation</title>
<link rel="stylesheet" href="app.css">
<style>
  /* The desk is the app's background, as xlsx.html's is. */
  body { background: transparent; }

  #deck { padding: 12px 8px 24px; }

  .ppt-note {
    max-width: 640px;
    margin: 0 auto 12px;
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--vw-card);
    color: var(--vw-on-card, var(--vw-ink));
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 1px 4px var(--vw-shadow);
  }
  .ppt-note strong { display: block; margin-bottom: 4px; font-size: 14px; }

  .ppt-slide {
    max-width: 640px;
    margin: 0 auto 12px;
    padding: 16px 18px 14px;
    border-radius: 12px;
    background: var(--vw-card);
    color: var(--vw-ink);
    box-shadow: 0 1px 4px var(--vw-shadow);
  }
  .ppt-num {
    font-size: 11px;
    letter-spacing: 0.12em;
    opacity: 0.55;
  }
  .ppt-title {
    margin: 6px 0 10px;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.3;
    white-space: pre-wrap;
  }
  .ppt-line {
    margin: 0 0 6px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="vw-status" class="vw-status vw-wait">Loading presentation…</div>
<div id="deck" data-vw-find></div>
<script src="app.js"></script>
<script src="find.js"></script>
<script src="prose-doc.js"></script>
<script src="ppt.js"></script>
</body>
</html>
