<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Time Hourglass - Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#8794da",
                        "surface-container-lowest": "#060e20",
                        "secondary": "#ffd799",
                        "surface-tint": "#adc6ff",
                        "on-secondary-fixed": "#281900",
                        "on-primary-fixed": "#001a42",
                        "on-secondary": "#432c00",
                        "inverse-primary": "#005ac2",
                        "outline": "#908f9d",
                        "on-primary-fixed-variant": "#004495",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "surface-container-low": "#131b2e",
                        "on-primary-container": "#5c96ff",
                        "surface-variant": "#2d3449",
                        "secondary-fixed": "#ffdeac",
                        "primary": "#adc6ff",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#dae2fd",
                        "on-tertiary": "#1d2b6a",
                        "tertiary-fixed": "#dee1ff",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-fixed-variant": "#354282",
                        "on-surface": "#dae2fd",
                        "surface-container-high": "#222a3d",
                        "on-secondary-container": "#6a4800",
                        "on-primary": "#002e6a",
                        "on-surface-variant": "#c6c5d4",
                        "tertiary-fixed-dim": "#b9c3ff",
                        "outline-variant": "#454652",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#b9c3ff",
                        "primary-fixed-dim": "#adc6ff",
                        "primary-container": "#002e69",
                        "on-error": "#690005",
                        "surface": "#0b1326",
                        "inverse-on-surface": "#283044",
                        "secondary-fixed-dim": "#ffba38",
                        "surface-container": "#171f33",
                        "on-secondary-fixed-variant": "#604100",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#021355",
                        "background": "#0b1326",
                        "tertiary-container": "#1c2a6a",
                        "secondary-container": "#feb300",
                        "error-container": "#93000a",
                        "surface-container-highest": "#2d3449"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": [
                            "Space Grotesk"
                        ],
                        "body": [
                            "Manrope"
                        ],
                        "label": [
                            "Manrope"
                        ]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
        
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(173, 198, 255, 0.8) 0%, rgba(173, 198, 255, 0) 70%);
            border-radius: 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body h-screen w-screen overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background / Particles -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low via-surface to-surface opacity-80"></div>
<!-- Decorative glowing orbs to simulate light/time -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary rounded-full mix-blend-screen filter blur-[120px] opacity-10"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary rounded-full mix-blend-screen filter blur-[100px] opacity-10"></div>
<!-- Static Particles (Replacing animation as requested) -->
<div class="particle w-2 h-2 top-[10%] left-[20%] opacity-40"></div>
<div class="particle w-1.5 h-1.5 top-[30%] left-[80%] opacity-60"></div>
<div class="particle w-3 h-3 top-[60%] left-[10%] opacity-30"></div>
<div class="particle w-2 h-2 top-[80%] left-[70%] opacity-50"></div>
<div class="particle w-1 h-1 top-[40%] left-[40%] opacity-70"></div>
<div class="particle w-2 h-2 top-[15%] left-[60%] opacity-20"></div>
<div class="particle w-1.5 h-1.5 top-[70%] left-[90%] opacity-40"></div>
<div class="particle w-3 h-3 top-[90%] left-[30%] opacity-10"></div>
<div class="particle w-2 h-2 top-[50%] left-[50%] opacity-50"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 h-full w-full flex flex-col justify-between items-center px-8 py-16">
<!-- Top Spacer for centering visually -->
<div class="flex-1 w-full flex justify-center items-start pt-12">
<!-- Subtle Brand Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container-high/50 backdrop-blur-[24px] flex items-center justify-center shadow-[0_12px_40px_rgba(11,19,38,0.4)] border border-outline-variant/15">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">hourglass_empty</span>
</div>
</div>
<!-- Center Typography -->
<div class="flex-none flex flex-col items-center text-center max-w-lg w-full space-y-6">
<h1 class="font-headline text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-primary to-secondary leading-tight">
                时光沙漏
            </h1>
<p class="font-body text-lg md:text-xl text-on-surface-variant font-light tracking-wide leading-relaxed">
                时间从不等人，但你可以记住它。
            </p>
</div>
<!-- Bottom Action -->
<div class="flex-1 w-full flex flex-col justify-end items-center pb-8">
<button class="w-full max-w-xs group relative overflow-hidden rounded-full p-[1px] shadow-[0_12px_40px_rgba(11,19,38,0.4)] transition-transform active:scale-95">
<!-- Gradient Border -->
<span class="absolute inset-0 bg-gradient-to-r from-primary to-secondary rounded-full opacity-70"></span>
<!-- Button Content -->
<div class="relative bg-surface-container-highest/80 backdrop-blur-[20px] rounded-full px-8 py-5 flex items-center justify-center space-x-3 transition-colors group-hover:bg-surface-container-highest/60">
<span class="font-headline font-medium text-lg text-primary tracking-[0.05rem]">开始</span>
<span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
<div class="mt-8">
<p class="font-label text-[10px] uppercase tracking-[0.05rem] text-outline-variant">The Chronos Ethereal</p>
</div>
</div>
</main>
</body></html>
