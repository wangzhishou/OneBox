# Gradle 守护进程堆内存; 本项目模块较多 (100+), release 的 R8 全量混淆需要大堆,
# 小内存机器可适当调低 (如 -Xmx8g, 但 release 构建可能 OOM)
org.gradle.jvmargs=-Xmx16g -XX:+UseG1GC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Configuration Cache
org.gradle.configuration-cache=true
# Compose 编译器报告默认关闭，需要时可在本地或命令行临时开启
kotlin.composeCompiler.generateReports=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# 启用 R8 Full Mode，获得更激进的代码缩减与优化
android.enableR8.fullMode=true
# 并行构建
org.gradle.parallel=true
# Kotlin 守护进程堆内存
kotlin.daemon.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
# 构建缓存
org.gradle.caching=true
org.gradle.cache.resolution=24h

# 不要在仓库里硬编码本机 JDK 路径。
# 本地如需固定 JDK，请使用 ~/.gradle/gradle.properties 或设置 JAVA_HOME。
android.defaults.buildfeatures.resvalues=false
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
